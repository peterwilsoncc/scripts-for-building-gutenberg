name: Build Gutenberg

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # schedule:
  #   - cron: '5 */2 * * *'

concurrency:
  group: build-gutenberg
  cancel-in-progress: true

jobs:
  build-all:
    name: Build Gutenberg branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Checkout WordPress/gutenberg
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: WordPress/gutenberg
          path: gutenberg-dev
          fetch-depth: 0

      - name: Log NVM Info
        shell: bash -l -eo pipefail {0}
        run: |
          if [[ -n "${NVM_DIR:-}" && -f "$NVM_DIR/nvm.sh" ]]; then
            source "$NVM_DIR/nvm.sh"
            echo "nvm path: $NVM_DIR/nvm.sh"
            echo "nvm version: $(nvm --version)"
          else
            echo "nvm was not found in the GitHub Actions runner environment"
          fi

      - name: Check NVM in PATH
        shell: bash -l -eo pipefail {0}
        run: |
          if nvm_path="$(type -P nvm)"; then
            echo "nvm executable in PATH: yes ($nvm_path)"
          else
            echo "nvm executable in PATH: no"
          fi

      - name: Exit
        run: exit 1;

      - name: Checkout peterwilsoncc/gutenberg-build
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: peterwilsoncc/gutenberg-build
          path: plugins/gutenberg-build
          ssh-key: ${{ github.ref == 'refs/heads/main' && secrets.PWCC_DEPLOY_KEY || '' }}
          fetch-depth: 0

      - name: Fetch and create local tracking branches
        run: |
          cd plugins/gutenberg-build
          # Fetch all branches
          git fetch origin
          # Create local tracking branches for all remote branches
          for branch in $(git branch -r | grep -v '\->' | grep -E 'origin/(trunk|wp/|release/)' | sed 's/origin\///'); do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || echo "Branch $branch already exists"
          done
          # List all branches for verification
          echo "Available local branches:"
          git branch -a

      - name: Configure Git
        run: |
          git config --global user.name "peterwilsonbcc"
          git config --global user.email "wilson+peterwilsonbcc@peterwilson.cc"

      - name: Build trunk branch
        shell: bash -l -eo pipefail {0}
        run: bash build-from-workflows.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log trunk reversed commits file
        run: |
          echo "Contents of log-files/trunk-workflow-commits-reversed.txt:"
          cat log-files/trunk-workflow-commits-reversed.txt

      - name: Log trunk commits
        run: |
          cd plugins/gutenberg-build
          echo "Recent commits on trunk branch:"
          git log --oneline -20

      - name: Build latest releases
        shell: bash -l -eo pipefail {0}
        run: bash build-latest-releases.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log latest releases commits
        run: |
          cd plugins/gutenberg-build
          echo "Branches built:"
          git branch -a
          echo "Recent commits:"
          git log --all --oneline -20

      - name: Build wp/6.7 branch
        shell: bash -l -eo pipefail {0}
        run: bash build-branch-from-workflows.sh wp/6.7
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.7 reversed commits file
        run: |
          echo "Contents of log-files/wp-6.7-workflow-commits-reversed.txt:"
          cat log-files/wp-6.7-workflow-commits-reversed.txt

      - name: Log wp/6.7 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.7
          echo "Recent commits on wp/6.7 branch:"
          git log --oneline -20

      - name: Build wp/6.8 branch
        shell: bash -l -eo pipefail {0}
        run: bash build-branch-from-workflows.sh wp/6.8
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.8 reversed commits file
        run: |
          echo "Contents of log-files/wp-6.8-workflow-commits-reversed.txt:"
          cat log-files/wp-6.8-workflow-commits-reversed.txt

      - name: Log wp/6.8 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.8
          echo "Recent commits on wp/6.8 branch:"
          git log --oneline -20

      - name: Build wp/6.9 branch
        shell: bash -l -eo pipefail {0}
        run: bash build-branch-from-workflows.sh wp/6.9
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.9 reversed commits file
        run: |
          echo "Contents of log-files/wp-6.9-workflow-commits-reversed.txt:"
          cat log-files/wp-6.9-workflow-commits-reversed.txt

      - name: Log wp/6.9 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.9
          echo "Recent commits on wp/6.9 branch:"
          git log --oneline -20

      - name: Build wp/7.0 branch
        shell: bash -l -eo pipefail {0}
        run: bash build-branch-from-workflows.sh wp/7.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/7.0 reversed commits file
        run: |
          echo "Contents of log-files/wp-7.0-workflow-commits-reversed.txt:"
          cat log-files/wp-7.0-workflow-commits-reversed.txt

      - name: Log wp/7.0 commits
        shell: bash -l -eo pipefail {0}
        run: |
          cd plugins/gutenberg-build
          git checkout wp/7.0
          echo "Recent commits on wp/7.0 branch:"
          git log --oneline -20

      - name: Build wp/7.1 branch
        run: bash build-branch-from-workflows.sh wp/7.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/7.1 reversed commits file
        run: |
          echo "Contents of log-files/wp-7.1-workflow-commits-reversed.txt:"
          cat log-files/wp-7.1-workflow-commits-reversed.txt

      - name: Log wp/7.1 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/7.1
          echo "Recent commits on wp/7.1 branch:"
          git log --oneline -20
