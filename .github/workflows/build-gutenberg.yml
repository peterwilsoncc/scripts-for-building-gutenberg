name: Build Gutenberg

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  # schedule:
  #   # Run daily at 2:00 AM UTC
  #   - cron: '0 2 * * *'

jobs:
  build-all:
    name: Build Gutenberg branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout WordPress/gutenberg
        uses: actions/checkout@v4
        with:
          repository: WordPress/gutenberg
          path: gutenberg-dev
          fetch-depth: 0

      - name: Checkout peterwilsoncc/gutenberg-build
        uses: actions/checkout@v4
        with:
          repository: peterwilsoncc/gutenberg-build
          path: plugins/gutenberg-build
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'gutenberg-dev/.nvmrc'

      - name: Configure Git
        run: |
          git config --global user.name "peterwilsonbcc"
          git config --global user.email "wilson+peterwilsonbcc@peterwilson.cc"

      - name: Reset branches back 3 commits
        run: |
          cd plugins/gutenberg-build
          # Reset trunk branch
          if git rev-parse --verify trunk >/dev/null 2>&1; then
            git checkout trunk
            git reset --hard HEAD~3
          fi
          # Reset wp/6.7 branch
          if git rev-parse --verify wp/6.7 >/dev/null 2>&1; then
            git checkout wp/6.7
            git reset --hard HEAD~3
          fi
          # Reset wp/6.8 branch
          if git rev-parse --verify wp/6.8 >/dev/null 2>&1; then
            git checkout wp/6.8
            git reset --hard HEAD~3
          fi
          # Reset wp/6.9 branch
          if git rev-parse --verify wp/6.9 >/dev/null 2>&1; then
            git checkout wp/6.9
            git reset --hard HEAD~3
          fi
          # Reset wp/7.0 branch
          if git rev-parse --verify wp/7.0 >/dev/null 2>&1; then
            git checkout wp/7.0
            git reset --hard HEAD~3
          fi
          git checkout trunk || git checkout main

      - name: Build trunk branch
        run: bash build-from-workflows.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log trunk commits
        run: |
          cd plugins/gutenberg-build
          echo "Recent commits on trunk branch:"
          git log --oneline -20

      - name: Build latest releases
        run: bash build-latest-releases.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log latest releases commits
        run: |
          cd plugins/gutenberg-build
          echo "Branches built:"
          git branch -a
          echo "Recent commits:"
          git log --all --oneline -20

      - name: Build wp/6.7 branch
        run: bash build-branch-from-workflows.sh wp/6.7
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.7 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.7
          echo "Recent commits on wp/6.7 branch:"
          git log --oneline -20

      - name: Build wp/6.8 branch
        run: bash build-branch-from-workflows.sh wp/6.8
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.8 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.8
          echo "Recent commits on wp/6.8 branch:"
          git log --oneline -20

      - name: Build wp/6.9 branch
        run: bash build-branch-from-workflows.sh wp/6.9
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/6.9 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/6.9
          echo "Recent commits on wp/6.9 branch:"
          git log --oneline -20

      - name: Build wp/7.0 branch
        run: bash build-branch-from-workflows.sh wp/7.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log wp/7.0 commits
        run: |
          cd plugins/gutenberg-build
          git checkout wp/7.0
          echo "Recent commits on wp/7.0 branch:"
          git log --oneline -20
